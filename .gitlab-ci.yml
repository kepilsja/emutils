stages:
  - release

update_changelog:
  stage: release
  image: alpine:latest # Use a lightweight image
  
  # This section configures Git and runs your script
  before_script:
    - apk add --no-cache git # Install Git in the container
    # Configure Git with a user name and email
    - git config --global user.name "GitLab CI Bot"
    - git config --global user.email "gitlab-ci-bot@your.domain.com"
    # Set up the remote URL with the deploy token for authentication
    - git remote set-url origin "http://${DEPLOY_USER}:${DEPLOY_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - apk add --no-cache --upgrade bash
    
  script:
    - echo "simple mod"
    - chmod -x scripts/bump_changelog.sh
    - bash scripts/bump_changelog.sh

    - |
      set -e
      # The 'git diff --quiet' command exits with 0 if there are no changes,
      # and 1 if there are changes. The 'if' statement uses this.
      if git diff --quiet CHANGELOG.md; then
        echo "✅ CHANGELOG.md was not modified. Nothing to do."
      else
        echo "📝 CHANGELOG.md was modified. Committing and pushing changes..."
        git add CHANGELOG.md
        git commit -m "ci: Update CHANGELOG.md [skip ci]"
        git push origin HEAD:${CI_COMMIT_REF_NAME}
        echo "🚀 Changelog pushed to repository."
      fi
        
    # Control when this job runs. For example, only on the 'main' branch.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'